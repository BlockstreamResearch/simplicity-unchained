[package]
name = "simplicity-unchained-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
description = "Portable, experimental Bitcoin policy context and off-chain extension registry"
license = "MIT"

[lib]
name = "simplicity_unchained_policy"
path = "src/lib.rs"

[dependencies]
simplicity-lang = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
elements = { version = "0.27.0", features = ["serde"] }
