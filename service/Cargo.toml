[package]
name = "service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
base64 = "0.22"
clap = { workspace = true }
hex = { workspace = true }
log = "0.4.29"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9.10"
tracing = "0.1"
tracing-subscriber = "0.3.0"

simplicity-lang = { workspace = true }
core = { path = "../core" }
simplicity-unchained-policy = { path = "../policy" }

[dev-dependencies]
http-body = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
