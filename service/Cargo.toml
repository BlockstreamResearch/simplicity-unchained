[package]
name = "service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
base64 = "0.22"
clap = { version = "4.5.53", features = ["derive"] }
hex = "0.4"
log = "0.4.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.147"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
toml = "0.9.10"
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3.0"
validator = { version = "0.20.0", features = ["derive"] }

hal-simplicity = { git = "https://github.com/BlockstreamResearch/hal-simplicity", rev = "31083136cad4799022044c65c7407deb828fb0a9" }
core = { path = "../core" }
