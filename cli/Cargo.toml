[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "simplicity-unchained"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { workspace = true }
core = { path = "../core" }
simplicity-lang = { workspace = true }
hex = { workspace = true }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "native-tls", "charset", "system-proxy"] }
serde = { workspace = true }
serde_json = { workspace = true }
