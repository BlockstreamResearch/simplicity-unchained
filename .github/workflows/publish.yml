name: Publish image

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: publish-master
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'BlockstreamResearch/simplicity-unchained'
    permissions:
      contents: read
      id-token: write
    uses: Blockstream/ci-components/.github/workflows/publish.yml@v1
    with:
      workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      image: ${{ vars.IMAGE_NAME }}
      environment: staging
