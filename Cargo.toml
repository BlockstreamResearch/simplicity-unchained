[package]
name = "simplicity-unchained-server"
version = "0.1.0"
description = "A Simplictiy Unchained server for Elements transactions."
authors = ["Andrew Poelstra <apoelstra@wpsoftware.net>"]
license = "LGPL-3.0"
edition = "2021"
rust-version = "1.74.0"

[dependencies]
anyhow = { version = "1.0.20", default-features = false, features = [ "std" ] }
p2c-s2c = { version = "0.1.1", default-features = false, features = [ "serde" ] }
serde = { version = "1.0.156", default-features = false, features = [ "derive" ] }
serde_json = { version = "1.0.145", default-features = false, features = [ "std" ] }
simplicity-lang = { version = "0.6.0", default-features = false, features = [ "base64", "elements", "serde" ] }
tiny_http = { version = "0.12.0", default-features = false }
