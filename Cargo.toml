[workspace]
resolver = "2"
members = [
    "cli",
    "core",
    "service"
]

[workspace.dependencies]
hal-simplicity = {path = "../hal-unchained"}
clap = { version = "4.5.53", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"

[patch.crates-io]
simplicity = { git = "https://github.com/topologoanatom/rust-simplicity.git", branch = "refactor/bit-iter-clone", package = "simplicity-lang", features = [ "base64", "serde" ] }
