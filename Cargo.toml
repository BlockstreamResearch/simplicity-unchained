[workspace]
resolver = "2"
members = [
    "cli",
    "core",
    "jet_plugin_abi",
    "service",
]

[workspace.dependencies]
simplicity-lang = { version = "0.9.0", features = ["base64"] }
clap = { version = "4.5.53", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
